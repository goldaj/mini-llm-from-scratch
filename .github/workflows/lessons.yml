name: Mini LLM lessons
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python lecon02.py --epochs 15 --length 10 --output /tmp/modele_softmax.json
      - run: python -m py_compile lecon03.py
      - run: python lecon03.py --epochs 3 --length 10 --output /tmp/modele_context_mlp.json
